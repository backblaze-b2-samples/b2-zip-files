name: Create and publish the Docker image (manual)

# Configures this workflow to run manually
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version - e.g. 1.0.0'
        required: true
        type: string
      latest:
        description: 'Add latest tag?'
        required: true
        type: boolean

# Defines two custom environment variables for the workflow. These are used for the Container registry domain, and a name for the Docker image that this workflow builds.
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# There is a single job in this workflow. It's configured to run on the latest available version of Ubuntu.
jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      # The binfmt image docker/setup-qemu-action ran, pinned by digest.
      - name: Set up QEMU
        env:
          BINFMT_IMAGE: docker.io/tonistiigi/binfmt:latest@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
        run: docker run --rm --privileged "$BINFMT_IMAGE" --install all

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name builder --driver docker-container
          docker buildx inspect --bootstrap

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.tag }}

      # Logs in to the Container registry using the account and password that will publish the packages. Once
      # published, the packages are scoped to the account defined here.
      - name: Log in to the Container registry
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin

      # Computes the tags and OCI labels docker/metadata-action produced for this config: the version tag, plus
      # `latest` when asked. The `id` "meta" allows the output of this step to be referenced in a subsequent step.
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          LATEST: ${{ inputs.latest }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME,,}"
          version="$(printf '%s' "$TAG" | sed -E 's/[^a-zA-Z0-9._-]+/-/g')"
          [ -n "$version" ] || { echo "::error::empty tag"; exit 1; }
          tags="${image}:${version}"
          if [ "$LATEST" = true ]; then tags+=$'\n'"${image}:latest"; fi
          repo="$(gh api "repos/${GITHUB_REPOSITORY}")"
          labels="$(jq -r --arg version "$version" --arg created "$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" --arg sha "$GITHUB_SHA" '
            "org.opencontainers.image.created=\($created)",
            "org.opencontainers.image.description=\(.description // "")",
            "org.opencontainers.image.licenses=\(.license.spdx_id // "")",
            "org.opencontainers.image.revision=\($sha)",
            "org.opencontainers.image.source=\(.html_url // "")",
            "org.opencontainers.image.title=\(.name // "")",
            "org.opencontainers.image.url=\(.html_url // "")",
            "org.opencontainers.image.version=\($version)"' <<< "$repo")"
          delim="EOF_$(openssl rand -hex 16)"
          {
            echo "tags<<$delim"; echo "$tags"; echo "$delim"
            echo "labels<<$delim"; echo "$labels"; echo "$delim"
          } >> "$GITHUB_OUTPUT"

      # Builds the image from the repository's `Dockerfile` and, if the build succeeds, pushes it to GitHub Packages,
      # tagged and labelled with the output from the "meta" step. The provenance attestation is the one
      # docker/build-push-action added by default for a public repository. The pushed digest is this step's output.
      - name: Build and push Docker image
        id: push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do [ -z "$tag" ] || args+=(--tag "$tag"); done <<< "$TAGS"
          while IFS= read -r label; do [ -z "$label" ] || args+=(--label "$label"); done <<< "$LABELS"
          metadata="$RUNNER_TEMP/build-metadata.json"
          docker buildx build . \
            --platform linux/amd64,linux/arm64 \
            --attest "type=provenance,mode=max,builder-id=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            --metadata-file "$metadata" \
            --push \
            "${args[@]}"
          digest="$(jq -r '."containerimage.digest" // empty' "$metadata")"
          [ -n "$digest" ] || { echo "::error::no image digest in the build metadata"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # This step generates an artifact attestation for the image, which is an unforgeable statement about where and how
      # it was built. It increases supply chain security for people who consume the image. For more information, see
      # "[AUTOTITLE](/actions/security-guides/using-artifact-attestations-to-establish-provenance-for-builds)."
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Log out of the Container registry
        if: always()
        run: docker logout "$REGISTRY"
